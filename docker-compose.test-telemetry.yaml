services:
  app:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      telemetry-collector:
        condition: service_healthy

  telemetry-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib@sha256:9bb39ed7220947178a93b9c0c7fa20d598b83e7fa96fe27b0735012da873ee50
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/collector-test.yaml:/etc/otelcol-contrib/config.yaml:ro
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 2s
