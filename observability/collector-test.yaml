receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  batch:

exporters:
  file:
    path: /var/lib/otelcol/osa-telemetry.json
    format: json

extensions:
  bearertokenauth:
    filename: /run/secrets/otlp-token
    retry_on_failure:
      enabled: true
      max_retries: 30
      interval: 1s
    wait_for_token_file: true
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]
