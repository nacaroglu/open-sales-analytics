name: Dependency scan

# Reusable: called by ci.yml (every pull request and push to main) and by
# dependency-scan-scheduled.yml (weekly). One definition, so both run the same audits.
on:
  workflow_call:

permissions:
  contents: read

# Neither audit step may fail silently: no `|| true`, no continue-on-error, so a finding or a
# scanner error turns the job, and the run, red.
jobs:
  dependency-scan:
    name: Dependency scan (Python, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      # uvx runs the scanner in a throwaway environment; it is not a project dependency.
      # Every locked package, dev tools included, is checked; any known vulnerability fails.
      - name: Audit Python dependencies (uv.lock)
        run: |
          uv export --locked --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # high and critical advisories fail; low and moderate are listed in the log only.
      - name: Audit npm dependencies (package-lock.json)
        run: npm audit --audit-level=high
        working-directory: frontend
