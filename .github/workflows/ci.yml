name: CI

on:
  push:
    branches: [main, 'feature/issue-*']
  # Never pull_request_target: a pull request runs its own code, without secrets.
  pull_request:

# Nothing in this workflow writes to the repository or needs a secret.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (tests, ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check backend
      - name: Ruff format check
        run: uv run ruff format --check backend
      - name: Mypy
        run: uv run mypy backend/app

  frontend:
    name: Frontend (tests, lint, type check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      # Its own step: a bundle that does not build fails here, whatever the other steps said.
      - name: Production build
        run: npm run build

  # Fails on any `uses:` that is not a local path and not pinned to a 40-character commit SHA.
  # Plain shell, no secret, no third-party action beyond checkout; runs on fork and Dependabot pull requests.
  # Policy: README.md (Pinned actions).
  pinned-actions:
    name: Actions are pinned to commit SHAs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every uses is a local path or a commit SHA
        run: |
          status=0
          while IFS= read -r hit; do
            file=${hit%%:*}; rest=${hit#*:}; line=${rest%%:*}; text=${rest#*:}
            ref=$(printf '%s' "$text" | sed -E 's/^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*//; s/[[:space:]]+#.*$//; s/^["'"'"']//; s/["'"'"']$//; s/[[:space:]]+$//')
            case "$ref" in
              ./*) continue ;;
            esac
            if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}$'; then
              echo "::error file=$file,line=$line::Unpinned action '$ref': pin it to a 40-character commit SHA (uses: owner/repo@<sha> # vX.Y.Z)"
              status=1
            fi
          done < <(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github --include='*.yml' --include='*.yaml')
          exit $status

  # The scan lives in dependency-scan.yml so the scheduled run (dependency-scan-scheduled.yml)
  # runs exactly the same commands. Policy: README.md (Dependency scanning).
  dependency-scan:
    name: Dependency scan (Python, npm)
    uses: ./.github/workflows/dependency-scan.yml

  # The container from the Dockerfile is built and started once; the health check and the
  # browser suite both run against it, on port 8000.
  docker-smoke:
    name: Container (build, smoke, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate base Compose configuration
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker-compose.yaml config --format json | python3 -c '
          import json
          import sys
          from pathlib import Path

          config = json.load(sys.stdin)
          assert set(config["services"]) == {"app"}
          service = config["services"]["app"]
          assert Path(service["build"]["context"]).resolve() == Path(".").resolve()
          assert service["build"]["dockerfile"] == "Dockerfile"
          assert service["environment"] == {
              "DATASET_DIR": "/data",
              "OSA_ENVIRONMENT": "development",
              "OSA_VERSION": "local",
          }
          assert service["ports"][0]["target"] == 8000
          assert str(service["ports"][0]["published"]) == "8000"
          assert service["volumes"][0]["type"] == "volume"
          assert service["volumes"][0]["source"] == "osa-data"
          assert service["volumes"][0]["target"] == "/data"
          assert "/health/ready" in " ".join(service["healthcheck"]["test"])
          assert service["healthcheck"]["interval"]
          assert service["healthcheck"]["timeout"]
          assert service["healthcheck"]["start_period"]
          assert service["healthcheck"]["retries"] > 0
          assert set(config["volumes"]) == {"osa-data"}
          '
      - name: Validate and exercise the test telemetry Compose override
        env:
          COMPOSE_PROJECT_NAME: osa-telemetry-ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          sink_dir="/tmp/osa-telemetry-${GITHUB_RUN_ID}"
          export OSA_TEST_TELEMETRY_DIR="$sink_dir"
          compose=(docker compose -f docker-compose.yaml -f docker-compose.test-telemetry.yaml)
          cleanup() {
            status=$?
            trap - EXIT
            "${compose[@]}" down --volumes --remove-orphans >/dev/null 2>&1 || status=1
            rm -rf "$sink_dir"
            if [ -n "$("${compose[@]}" ps -aq 2>/dev/null)" ] || \
              [ -n "$(docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" 2>/dev/null)" ]; then
              echo "Test telemetry Compose resources remain after cleanup"
              status=1
            fi
            if [ -e "$sink_dir" ]; then
              echo "Test telemetry sink directory remains after cleanup"
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT

          mkdir -p "$sink_dir"
          chmod 0777 "$sink_dir"
          test -w "$sink_dir"
          test "$(stat -c '%a' "$sink_dir")" = "777"

          "${compose[@]}" config --quiet
          "${compose[@]}" config --format json | python3 -c '
          import json
          import sys

          config = json.load(sys.stdin)
          assert set(config["services"]) == {"app", "telemetry-collector"}
          app = config["services"]["app"]
          assert app["environment"]["OTEL_EXPORTER_OTLP_ENDPOINT"] == "http://telemetry-collector:4318"
          assert app["environment"]["OTEL_EXPORTER_OTLP_PROTOCOL"] == "http/protobuf"
          assert str(app["ports"][0]["published"]) == "8000"
          collector = config["services"]["telemetry-collector"]
          assert collector["image"] == "otel/opentelemetry-collector-contrib@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6"
          assert len(collector["image"].split("@sha256:", 1)[1]) == 64
          assert {str(port["published"]) for port in collector["ports"]} == {"4318", "13133"}
          assert all(port["host_ip"] == "127.0.0.1" for port in collector["ports"])
          assert set(config["volumes"]) == {"osa-data"}
          '
          docker run --rm \
            -v "$PWD/observability/collector-test.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6 \
            validate --config=/etc/otelcol-contrib/config.yaml

          "${compose[@]}" up --detach telemetry-collector
          collector_id="$("${compose[@]}" ps -q telemetry-collector)"
          test -n "$collector_id"
          docker inspect --format='{{json .Mounts}}' "$collector_id" | python3 -c '
          import json
          import os
          import sys

          mounts = json.load(sys.stdin)
          sink = next(mount for mount in mounts if mount["Destination"] == "/var/lib/otelcol")
          assert sink["Type"] == "bind"
          assert sink["Source"] == os.environ["OSA_TEST_TELEMETRY_DIR"]
          assert sink["RW"] is True
          '
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13133/ >/dev/null; then
              ready=1
              break
            fi
            status="$(docker inspect --format='{{.State.Status}}' "$collector_id")"
            if [ "$status" != running ]; then
              "${compose[@]}" logs telemetry-collector
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1

          curl -fsS -X POST http://127.0.0.1:4318/v1/logs \
            -H 'Content-Type: application/json' \
            --data '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"osa-ci-synthetic"}},{"key":"deployment.environment.name","value":{"stringValue":"test"}},{"key":"service.version","value":{"stringValue":"ci-synthetic"}}]},"scopeLogs":[{"logRecords":[{"body":{"stringValue":"telemetry-sink-smoke"}}]}]}]}'
          sink_file="$sink_dir/osa-telemetry.json"
          captured=0
          for _ in $(seq 1 15); do
            if [ -s "$sink_file" ]; then
              captured=1
              break
            fi
            sleep 1
          done
          if [ "$captured" -ne 1 ]; then
            echo "Collector accepted OTLP but did not produce a non-empty file sink; Collector diagnostics follow"
            "${compose[@]}" logs --no-color --tail=100 telemetry-collector
            docker inspect --format='state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} mounts={{json .Mounts}}' "$collector_id"
          fi
          test "$captured" -eq 1
          python3 -c '
          import json
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          records = [json.loads(line) for line in lines]
          assert records, "Collector sink contains no JSON records"
          attributes = {
              item["key"]: item["value"].get("stringValue")
              for record in records
              for resource_log in record.get("resourceLogs", [])
              for item in resource_log.get("resource", {}).get("attributes", [])
          }
          expected = {
              "service.name": "osa-ci-synthetic",
              "deployment.environment.name": "test",
              "service.version": "ci-synthetic",
          }
          assert all(attributes.get(key) == value for key, value in expected.items()), attributes
          bodies = [
              log_record.get("body", {}).get("stringValue")
              for record in records
              for resource_log in record.get("resourceLogs", [])
              for scope_log in resource_log.get("scopeLogs", [])
              for log_record in scope_log.get("logRecords", [])
          ]
          assert "telemetry-sink-smoke" in bodies, bodies
          ' "$sink_file"

          "${compose[@]}" down --volumes --remove-orphans
          test -z "$("${compose[@]}" ps -aq)"
          if docker inspect "$collector_id" >/dev/null 2>&1; then
            echo "Test telemetry Collector still exists after cleanup"
            exit 1
          fi
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          rm -rf "$sink_dir"
          test ! -e "$sink_dir"
          trap - EXIT
          OSA_ENVIRONMENT=production OSA_VERSION=ci-version OSA_PORT=18080 DATASET_DIR=/custom-data \
            docker compose -f docker-compose.yaml config --format json | python3 -c '
          import json
          import sys

          config = json.load(sys.stdin)
          service = config["services"]["app"]
          assert service["environment"]["OSA_ENVIRONMENT"] == "production"
          assert service["environment"]["OSA_VERSION"] == "ci-version"
          assert service["environment"]["DATASET_DIR"] == "/custom-data"
          assert str(service["ports"][0]["published"]) == "18080"
          assert service["volumes"][0]["target"] == "/custom-data"
          '
      - name: Validate deployment Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          digest='example.invalid/open-sales-analytics:ci@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          caddy_image='caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb'
          ci_hash="$(docker run --rm --entrypoint caddy "$caddy_image" hash-password --plaintext ci-only)"
          auth_block="$(printf 'basic_auth {\n  ci-user %s\n}' "$ci_hash")"
          valid_image() { [[ "$1" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; }
          if valid_image ''; then exit 1; fi
          if valid_image 'example.invalid/open-sales-analytics:ci'; then exit 1; fi
          if valid_image 'example.invalid/open-sales-analytics@sha256:abc'; then exit 1; fi
          valid_image "$digest"

          common_env=(OSA_IMAGE="$digest" OSA_HOSTNAME=osa.example.invalid OSA_VERSION=ci-version)
          env "${common_env[@]}" OSA_ENVIRONMENT=development PUBLIC_DEMO_MODE=false \
            CADDY_AUTH_BLOCK="$auth_block" \
            docker compose -f docker-compose.yaml -f docker-compose.deploy.yaml config --quiet
          env "${common_env[@]}" OSA_ENVIRONMENT=development PUBLIC_DEMO_MODE=false \
            CADDY_AUTH_BLOCK="$auth_block" \
            docker compose -f docker-compose.yaml -f docker-compose.deploy.yaml config --format json | python3 -c '
          import json
          import sys

          config = json.load(sys.stdin)
          app = config["services"]["app"]
          caddy = config["services"]["caddy"]
          assert app["image"] == "example.invalid/open-sales-analytics:ci@sha256:" + "a" * 64
          assert "build" not in app
          assert app.get("ports", []) == []
          assert app["volumes"][0]["target"] == "/data"
          assert "/health/ready" in " ".join(app["healthcheck"]["test"])
          assert app["environment"]["OSA_ENVIRONMENT"] == "development"
          assert app["environment"]["OSA_VERSION"] == "ci-version"
          assert app["environment"]["PUBLIC_DEMO_MODE"] == "false"
          assert app["restart"] == "unless-stopped"
          assert caddy["image"] == "caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb"
          assert {str(port["published"]) for port in caddy["ports"]} == {"80", "443"}
          assert caddy["environment"]["OSA_HOSTNAME"] == "osa.example.invalid"
          assert "basic_auth" in caddy["environment"]["CADDY_AUTH_BLOCK"]
          assert caddy["depends_on"]["app"]["condition"] == "service_healthy"
          assert caddy["restart"] == "unless-stopped"
          '
          env "${common_env[@]}" OSA_ENVIRONMENT=production PUBLIC_DEMO_MODE=true \
            CADDY_AUTH_BLOCK= \
            docker compose -f docker-compose.yaml -f docker-compose.deploy.yaml config --format json | python3 -c '
          import json
          import sys

          config = json.load(sys.stdin)
          assert config["services"]["app"]["environment"]["PUBLIC_DEMO_MODE"] == "true"
          assert config["services"]["caddy"]["environment"]["CADDY_AUTH_BLOCK"] == ""
          '
          docker run --rm --entrypoint caddy \
            -e OSA_HOSTNAME=osa.example.invalid \
            -e CADDY_AUTH_BLOCK="$auth_block" \
            -v "$PWD/Caddyfile.deploy:/etc/caddy/Caddyfile:ro" \
            "$caddy_image" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start and clean up the base Compose project
        run: |
          set -euo pipefail
          cleanup() {
            docker compose down -v --remove-orphans
          }
          trap cleanup EXIT

          docker compose up --build --detach
          container_id="$(docker compose ps -q app)"
          volume_name="$(docker compose config --format json | python3 -c 'import json, sys; print(json.load(sys.stdin)["volumes"]["osa-data"]["name"])')"
          test -n "$container_id"
          docker volume inspect "$volume_name" >/dev/null

          ready=0
          health="starting"
          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health/ready -o /tmp/osa-compose-ready.json 2>/dev/null; then
              ready=1
            fi
            health="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
            if [ "$ready" -eq 1 ] && [ "$health" = healthy ]; then
              break
            fi
            if [ "$health" = unhealthy ]; then
              docker compose logs
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1
          test "$health" = healthy
          python3 -c 'import json; d=json.load(open("/tmp/osa-compose-ready.json")); assert d["status"] == "ready"; assert d["environment"] == "development"; assert d["version"] == "local"'

          docker compose down -v --remove-orphans
          trap - EXIT
          if docker volume inspect "$volume_name" >/dev/null 2>&1; then
            echo "Compose-managed data volume still exists after docker compose down -v"
            exit 1
          fi
      - name: Build image
        run: |
          version="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short=7 HEAD)"
          docker build --build-arg OSA_VERSION="$version" -t open-sales-analytics .
          label="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.version" }}' open-sales-analytics)"
          test "$label" = "$version"
          [[ "$label" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]]
          docker run --rm -e PYTHONPATH=/app/backend --entrypoint python open-sales-analytics -c 'from app.config import Settings; s = Settings(); assert s.osa_environment == "development"; assert s.osa_version == "'"$version"'"'
          docker run --rm -e PYTHONPATH=/app/backend -e OSA_ENVIRONMENT=production -e OSA_VERSION=runtime-override --entrypoint python open-sales-analytics -c 'from app.config import Settings; s = Settings(); assert s.osa_environment == "production"; assert s.osa_version == "runtime-override"'
      - name: Verify the runtime image contains only production artifacts
        run: |
          docker run --rm --entrypoint python open-sales-analytics -c '
          from importlib.util import find_spec
          from pathlib import Path

          assert Path("/app/frontend/dist/index.html").is_file()
          assert not Path("/app/frontend/src").exists()
          assert not Path("/app/frontend/node_modules").exists()
          assert not Path("/usr/local/bin/node").exists()
          assert not Path("/usr/local/lib/node_modules").exists()
          for module in ("pytest", "ruff", "mypy"):
              assert find_spec(module) is None, f"development dependency {module} is installed"
          '
      - name: Start container
        # The one-minute lifetime lets the browser suite see a real expiry.
        run: docker run -d --name oca -p 8000:8000 -e DATASET_TTL_SECONDS=60 open-sales-analytics
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check health response and single-page app
        run: |
          curl -f http://localhost:8000/api/health
          curl -f http://localhost:8000/d/anything | grep -qi '<div id="root"'
      - name: Wait for Docker health status
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' oca)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          docker inspect --format='container health status: {{.State.Health.Status}}' oca
          exit 1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: frontend
      # The system libraries are not part of the cached download.
      - name: Install Chromium system libraries
        run: npx playwright install-deps chromium
        working-directory: frontend
      - name: Run browser tests against the container
        run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8000
      # Screenshots only. Traces hold every network response, so with CI set Playwright records none
      # (playwright.config.ts). Nothing from the container's /data directory is ever uploaded.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-screenshots
          path: frontend/test-results/**/*.png
          retention-days: 5
          if-no-files-found: ignore
      - name: Show container logs on failure
        if: failure()
        run: docker logs oca
      - name: Remove container
        if: always()
        run: docker rm -f oca

