name: CI

on:
  push:
    branches: [main]
  # Never pull_request_target: a pull request runs its own code, without secrets.
  pull_request:

# Nothing in this workflow writes to the repository or needs a secret.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (tests, ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check backend
      - name: Ruff format check
        run: uv run ruff format --check backend
      - name: Mypy
        run: uv run mypy backend/app

  frontend:
    name: Frontend (tests, lint, type check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      # Its own step: a bundle that does not build fails here, whatever the other steps said.
      - name: Production build
        run: npm run build

  # Dependency scan of both lockfiles. The policy is in README.md (Dependency scanning). Neither
  # step is allowed to fail silently: no `|| true`, no continue-on-error, so a finding or a scanner
  # error turns the job, and the run, red.
  dependency-scan:
    name: Dependency scan (Python, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # uvx runs the scanner in a throwaway environment; it is not a project dependency.
      # Every locked package, dev tools included, is checked; any known vulnerability fails.
      - name: Audit Python dependencies (uv.lock)
        run: |
          uv export --locked --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      # high and critical advisories fail; low and moderate are listed in the log only.
      - name: Audit npm dependencies (package-lock.json)
        run: npm audit --audit-level=high
        working-directory: frontend

  # The container from the Dockerfile is built and started once; the health check and the
  # browser suite both run against it, on port 8000.
  docker-smoke:
    name: Container (build, smoke, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t open-sales-analytics .
      - name: Start container
        # The one-minute lifetime lets the browser suite see a real expiry.
        run: docker run -d --name oca -p 8000:8000 -e DATASET_TTL_SECONDS=60 open-sales-analytics
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check health response and single-page app
        run: |
          curl -f http://localhost:8000/api/health
          curl -f http://localhost:8000/d/anything | grep -qi '<div id="root"'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: frontend
      # The system libraries are not part of the cached download.
      - name: Install Chromium system libraries
        run: npx playwright install-deps chromium
        working-directory: frontend
      - name: Run browser tests against the container
        run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8000
      # Screenshots only. Traces hold every network response, so with CI set Playwright records none
      # (playwright.config.ts). Nothing from the container's /data directory is ever uploaded.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: frontend/test-results/**/*.png
          retention-days: 5
          if-no-files-found: ignore
      - name: Show container logs on failure
        if: failure()
        run: docker logs oca
      - name: Remove container
        if: always()
        run: docker rm -f oca
