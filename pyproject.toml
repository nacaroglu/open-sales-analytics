[project]
name = "open-sales-analytics"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Small rule set: pycodestyle errors, pyflakes, import order, bugbear.
# Line length is left to the formatter, so E501 is ignored below.
select = ["E", "F", "I", "B"]
# B008: FastAPI's Depends(...) and File(...) calls in argument defaults are the framework's idiom.
ignore = ["B008", "E501"]

[tool.mypy]
# Default (non-strict) mode, application code only: run as `mypy backend/app`.
python_version = "3.12"
mypy_path = "backend"
plugins = ["pydantic.mypy"]
