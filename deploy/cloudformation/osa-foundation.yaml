                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt Ec2InstanceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: ManageOsaProdInstanceProfile
                Effect: Allow
                Action:
                  - iam:AddRoleToInstanceProfile
