AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Shared OSA foundation: a two-AZ VPC, immutable image repository, GitHub OIDC provider,
  and baseline image-build and CloudFormation execution roles. No application instances or
  security groups are created by this template.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    Description: IPv4 CIDR for the dedicated osa-foundation VPC.
    AllowedPattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[1-2][0-9]|3[0-2])$
  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First Availability Zone; must differ from AvailabilityZone2.
  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second Availability Zone; must differ from AvailabilityZone1.
  PublicSubnet1Cidr:
    Type: String
    Default: 10.40.0.0/20
    Description: Public subnet CIDR in AvailabilityZone1.
    AllowedPattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[1-2][0-9]|3[0-2])$
  PublicSubnet2Cidr:
    Type: String
    Default: 10.40.16.0/20
    Description: Public subnet CIDR in AvailabilityZone2.
    AllowedPattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[1-2][0-9]|3[0-2])$
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.40.32.0/20
    Description: Private subnet CIDR in AvailabilityZone1.
    AllowedPattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[1-2][0-9]|3[0-2])$
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.40.48.0/20
    Description: Private subnet CIDR in AvailabilityZone2.
    AllowedPattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[1-2][0-9]|3[0-2])$
  RepositoryName:
    Type: String
    Default: open-sales-analytics
    Description: ECR repository name. Keep this stable for downstream build and deploy workflows.
    MaxLength: 256
    AllowedPattern: ^[a-z0-9]+(?:[._/-][a-z0-9]+)*$
  GitHubOwner:
    Type: String
    Description: GitHub organization or user that owns this repository; used in exact OIDC subjects.
    MinLength: 1
    MaxLength: 39
    AllowedPattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
  GitHubRepository:
    Type: String
    Description: GitHub repository name, without owner or .git suffix.
    MinLength: 1
    MaxLength: 100
    AllowedPattern: ^[A-Za-z0-9_.-]+$
  GitHubMainBranch:
    Type: String
    Default: main
    Description: Exact branch allowed to assume the image-build role.
    AllowedPattern: ^[A-Za-z0-9][A-Za-z0-9._/-]*$

Rules:
  AvailabilityZonesMustDiffer:
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref AvailabilityZone1
            - !Ref AvailabilityZone2
        AssertDescription: AvailabilityZone1 and AvailabilityZone2 must be different.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone1
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-az1"
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName
        - Key: Network
          Value: public

  PublicSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone2
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-az2"
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName
        - Key: Network
          Value: public

  PrivateSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone1
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-az1"
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName
        - Key: Network
          Value: private

  PrivateSubnetAz2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone2
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-az2"
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName
        - Key: Network
          Value: private

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public"
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteAssociationAz1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAz1

  PublicRouteAssociationAz2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetAz2

  PrivateRouteTableAz1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-az1"
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

  PrivateRouteTableAz2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-az2"
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

  PrivateRouteAssociationAz1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableAz1
      SubnetId: !Ref PrivateSubnetAz1

  PrivateRouteAssociationAz2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableAz2
      SubnetId: !Ref PrivateSubnetAz2

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-build"
      Path: !Sub "/${AWS::StackName}/"
      Description: GitHub Actions may push images only to the OSA ECR repository.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubMainBranchOnly
            Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubMainBranch}"
      Policies:
        - PolicyName: PushOnlyToOsaRepository
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorizationToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushImagesToFoundationRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
      Tags:
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

  FoundationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-foundation-execution"
      Path: !Sub "/${AWS::StackName}/"
      Description: CloudFormation service role limited to the shared OSA foundation resources.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFormationServiceOnly
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageOsaFoundationResources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeVpcState
                Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVpcAttribute
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: ManageVpc
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*"
              - Sid: ManageSubnets
                Effect: Allow
                Action:
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*"
              - Sid: ManageInternetGateway
                Effect: Allow
                Action:
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*"
              - Sid: ManageRouteTablesAndRoutes
                Effect: Allow
                Action:
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*"
              - Sid: AttachInternetGateway
                Effect: Allow
                Action:
                  - ec2:AttachInternetGateway
                  - ec2:CreateVpcGatewayAttachment
                  - ec2:DeleteVpcGatewayAttachment
                  - ec2:DetachInternetGateway
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*"
              - Sid: AssociateSubnetRouteTables
                Effect: Allow
                Action:
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
              - Sid: ManageFoundationTags
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*"
                Condition:
                  ForAnyValue:StringEquals:
                    aws:TagKeys:
                      - Project
                      - Name
                      - OSAStack
              - Sid: ManageRepository
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:PutImageScanningConfiguration
                  - ecr:TagResource
                  - ecr:UntagResource
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}"
              - Sid: ManageFoundationRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}/*"
              - Sid: ManageGitHubOidcProvider
                Effect: Allow
                Action:
                  - iam:AddClientIDToOpenIDConnectProvider
                  - iam:CreateOpenIDConnectProvider
                  - iam:DeleteOpenIDConnectProvider
                  - iam:GetOpenIDConnectProvider
                  - iam:RemoveClientIDFromOpenIDConnectProvider
                  - iam:TagOpenIDConnectProvider
                  - iam:UntagOpenIDConnectProvider
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
              - Sid: ListFoundationProviders
                Effect: Allow
                Action:
                  - iam:ListOpenIDConnectProviders
                  - iam:ListRoles
                Resource: "*"
      Tags:
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

Outputs:
  StackName:
    Description: CloudFormation stack name; deploy this template as osa-foundation for the documented names.
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-StackName"
  Region:
    Description: AWS Region containing this stack and its CloudFormation exports.
    Value: !Ref AWS::Region
    Export:
      Name: !Sub "${AWS::StackName}-Region"
  AvailabilityZone1:
    Description: First configured Availability Zone.
    Value: !Ref AvailabilityZone1
  AvailabilityZone2:
    Description: Second configured Availability Zone.
    Value: !Ref AvailabilityZone2
  VpcId:
    Description: VPC ID for downstream application and observability stacks.
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  PublicSubnetAz1Id:
    Description: Public subnet in AvailabilityZone1.
    Value: !Ref PublicSubnetAz1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetAz1Id"
  PublicSubnetAz2Id:
    Description: Public subnet in AvailabilityZone2.
    Value: !Ref PublicSubnetAz2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetAz2Id"
  PrivateSubnetAz1Id:
    Description: Private subnet in AvailabilityZone1.
    Value: !Ref PrivateSubnetAz1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetAz1Id"
  PrivateSubnetAz2Id:
    Description: Private subnet in AvailabilityZone2.
    Value: !Ref PrivateSubnetAz2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetAz2Id"
  PublicSubnetIds:
    Description: Comma-separated public subnet IDs; downstream templates can use Fn::Split after Fn::ImportValue.
    Value: !Join [",", [!Ref PublicSubnetAz1, !Ref PublicSubnetAz2]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIds"
  PrivateSubnetIds:
    Description: Comma-separated private subnet IDs; downstream templates can use Fn::Split after Fn::ImportValue.
    Value: !Join [",", [!Ref PrivateSubnetAz1, !Ref PrivateSubnetAz2]]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"
  RepositoryArn:
    Description: ARN of the immutable, scan-on-push ECR repository.
    Value: !GetAtt Repository.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryArn"
  RepositoryUri:
    Description: ECR repository URI for image build and deploy workflows.
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryUri"
  OidcProviderArn:
    Description: IAM OIDC provider ARN for GitHub Actions.
    Value: !Ref GitHubOidcProvider
    Export:
      Name: !Sub "${AWS::StackName}-OidcProviderArn"
  BuildRoleArn:
    Description: GitHub OIDC role allowed to push only to the OSA ECR repository.
    Value: !GetAtt BuildRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BuildRoleArn"
  FoundationExecutionRoleArn:
    Description: CloudFormation service role for the shared foundation resources.
    Value: !GetAtt FoundationExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FoundationExecutionRoleArn"
