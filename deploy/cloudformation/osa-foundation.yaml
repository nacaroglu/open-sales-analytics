                  - iam:UntagInstanceProfile
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/osa-prod/*"
              - Sid: ManageOsaProdReleaseImageParameter
                Effect: Allow
