  DevCaddyAuthEc2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ec2-dev-instance"
      Path: !Sub "/${AWS::StackName}/"
      Description: Development EC2 may pull the OSA image, use Session Manager, and read its Caddy auth parameter.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Ec2ServiceOnly
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullAndReadDevCaddyAuth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorizationToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullImagesFromFoundationRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt Repository.Arn
              - Sid: ReadOnlyDevCaddyAuthParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/osa/dev/caddy/auth"
              - Sid: DecryptOnlyDevCaddyAuthParameterThroughSsm
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}"
                    kms:EncryptionContext:PARAMETER_ARN: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/osa/dev/caddy/auth"
                  ForAnyValue:StringEquals:
                    kms:ResourceAliases: alias/aws/ssm
              - Sid: SessionManagerInstanceRegistration
                Effect: Allow
                Action: ssm:UpdateInstanceInformation
                Resource: "*"
              - Sid: SessionManagerChannels
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
      Tags:
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

  Ec2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ec2-instance"
      Path: !Sub "/${AWS::StackName}/"
      Description: Production EC2 may pull only the foundation image and use Session Manager.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Ec2ServiceOnly
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullOnlyOsaRepository
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorizationToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullImagesFromFoundationRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt Repository.Arn
              - Sid: SessionManagerInstanceRegistration
                Effect: Allow
                Action: ssm:UpdateInstanceInformation
                Resource: "*"
              - Sid: SessionManagerChannels
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
      Tags:
        - Key: Project
          Value: open-sales-analytics
        - Key: OSAStack
          Value: !Ref AWS::StackName

Outputs:
  StackName:
    Description: CloudFormation stack name; deploy this template as osa-foundation for the documented names.
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub "${AWS::StackName}-StackName"
  Region:
    Description: AWS Region containing this stack and its CloudFormation exports.
    Value: !Ref AWS::Region
    Export:
      Name: !Sub "${AWS::StackName}-Region"
  AvailabilityZone1:
    Description: First configured Availability Zone.
    Value: !Ref AvailabilityZone1
  AvailabilityZone2:
    Description: Second configured Availability Zone.
    Value: !Ref AvailabilityZone2
  VpcId:
    Description: VPC ID for downstream application and observability stacks.
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  PublicSubnetAz1Id:
    Description: Public subnet in AvailabilityZone1.
    Value: !Ref PublicSubnetAz1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetAz1Id"
  PublicSubnetAz2Id:
    Description: Public subnet in AvailabilityZone2.
    Value: !Ref PublicSubnetAz2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetAz2Id"
  PrivateSubnetAz1Id:
    Description: Private subnet in AvailabilityZone1.
    Value: !Ref PrivateSubnetAz1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetAz1Id"
  PrivateSubnetAz2Id:
    Description: Private subnet in AvailabilityZone2.
    Value: !Ref PrivateSubnetAz2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetAz2Id"
  PublicSubnetIds:
    Description: Comma-separated public subnet IDs; downstream templates can use Fn::Split after Fn::ImportValue.
    Value: !Join [",", [!Ref PublicSubnetAz1, !Ref PublicSubnetAz2]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIds"
  PrivateSubnetIds:
    Description: Comma-separated private subnet IDs; downstream templates can use Fn::Split after Fn::ImportValue.
    Value: !Join [",", [!Ref PrivateSubnetAz1, !Ref PrivateSubnetAz2]]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"
  RepositoryArn:
    Description: ARN of the immutable, scan-on-push ECR repository.
    Value: !GetAtt Repository.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryArn"
  RepositoryUri:
    Description: ECR repository URI for image build and deploy workflows.
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryUri"
  OidcProviderArn:
    Description: IAM OIDC provider ARN for GitHub Actions.
    Value: !Ref GitHubOidcProvider
    Export:
      Name: !Sub "${AWS::StackName}-OidcProviderArn"
  BuildRoleArn:
    Description: GitHub OIDC role allowed to push only to the OSA ECR repository.
    Value: !GetAtt BuildRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BuildRoleArn"
  FoundationExecutionRoleArn:
    Description: CloudFormation service role for the shared foundation resources.
    Value: !GetAtt FoundationExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FoundationExecutionRoleArn"
  DevDeployRoleArn:
    Description: GitHub OIDC role for osa-dev deployment from the configured main branch.
    Value: !GetAtt DevDeployRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DevDeployRoleArn"
  ProductionPromotionRoleArn:
    Description: GitHub OIDC role for osa-prod promotion from the protected production environment.
    Value: !GetAtt ProductionPromotionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProductionPromotionRoleArn"
  DevApplicationExecutionRoleArn:
    Description: CloudFormation service role limited to osa-dev tagged resources.
    Value: !GetAtt DevApplicationExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DevApplicationExecutionRoleArn"
  ProdApplicationExecutionRoleArn:
    Description: CloudFormation service role limited to osa-prod tagged resources.
    Value: !GetAtt ProdApplicationExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProdApplicationExecutionRoleArn"
  ObservabilityExecutionRoleArn:
    Description: CloudFormation service role limited to observability tagged resources.
    Value: !GetAtt ObservabilityExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ObservabilityExecutionRoleArn"
  Ec2InstanceRoleArn:
    Description: EC2 instance role limited to ECR image pulls and Systems Manager core.
    Value: !GetAtt Ec2InstanceRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-Ec2InstanceRoleArn"
  DevCaddyAuthEc2InstanceRoleName:
    Description: Development-only EC2 role allowed to read the Caddy authentication SecureString.
    Value: !Ref DevCaddyAuthEc2InstanceRole
    Export:
      Name: !Sub "${AWS::StackName}-DevCaddyAuthEc2InstanceRoleName"
